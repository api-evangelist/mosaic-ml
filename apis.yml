aid: mosaic-ml
name: Mosaic Ml
description: >-
  MosaicML - now Databricks Mosaic Research - is a machine learning systems
  company that builds open-source tooling for training and deploying large
  neural networks and generative AI models faster and at lower cost. Its
  flagship open-source projects include Composer (a PyTorch library of training
  speedup methods), LLM Foundry (code for training and finetuning large language
  models), and Streaming (a library for streaming large datasets from cloud
  object stores into PyTorch training). MosaicML also shipped a managed
  training and inference platform driven by the mosaicml-cli (mcli) command-line
  tool; following the 2023 Databricks acquisition that platform is now offered as
  Databricks Mosaic AI. The company does not publish a standalone public
  REST/OpenAPI surface - its developer surface is Python packages, a CLI, and its
  open-source GitHub repositories.
